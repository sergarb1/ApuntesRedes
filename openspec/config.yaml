schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

context: |
  Proyecto: Apuntes PAR (Planificación y Administración de Redes). CFGS ASIR.
  Stack: Astro 7 + Starlight 0.41, castellano, GitHub Pages, base path /ApuntesRedes.
  Contenido: Unidad 01 de introducción + 12 unidades didácticas (U02-U13),
    cada unidad ampliada como "libro": un fichero Markdown por punto de teoría
    (src/content/docs/<unidad>/<nn>-<punto>.md) más una página índice de unidad.
    Secciones obligatorias del cierre: Sé el Paquete, Fireside Chat, ¿Quién Soy?,
    CONRAD VS EL MUNDO, Laboratorio de tortura (con fallo intencionado), Atrévete a pensar,
    Crucigrama de bits, Entrevista de trabajo, No hay preguntas tontas, Poscréditos.
    Soluciones SIEMPRE en <details>. Boletines en src/content/docs/boletines/ con patrón
    inicial/avanzado + -resuelto. PDF por starlight-to-pdf, EPUB por Pandoc.
  Norma de contenido: nivel de entrada cero, explicaciones con analogías cotidianas,
  mínimo ~120-200 líneas por punto de teoría, cada ejercicio con solución y cada
  laboratorio con un fallo intencionado.

